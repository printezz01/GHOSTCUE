<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GhostCue Overlay</title>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:rgba(18,18,22,0.88);
  --surface:rgba(255,255,255,0.04);
  --surface-hover:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);
  --border-active:rgba(255,255,255,0.15);
  --text:rgba(255,255,255,0.92);
  --text-dim:rgba(255,255,255,0.5);
  --text-muted:rgba(255,255,255,0.3);
  --accent:#6e56cf;
  --green:#30a46c;
  --red:#e5484d;
  --yellow:#f5d90a;
  --blue:#3b82f6;
  --radius:12px;
  --radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
body{font-family:var(--font);background:transparent;color:var(--text);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── Overlay Container ── */
#overlay{
  position:fixed;top:60px;right:24px;width:360px;max-height:600px;
  background:var(--bg);backdrop-filter:blur(24px) saturate(1.4);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 8px 40px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.03);
  display:flex;flex-direction:column;overflow:hidden;
  transition:all .25s cubic-bezier(.4,0,.2,1);z-index:999999;
  user-select:none;
}
#overlay.minimized{max-height:40px;overflow:hidden}
#overlay.minimized .overlay-body,#overlay.minimized .overlay-footer{display:none}

/* ── Drag Handle / Header ── */
.overlay-header{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  cursor:grab;border-bottom:1px solid var(--border);flex-shrink:0;
  background:rgba(255,255,255,0.02);
}
.overlay-header:active{cursor:grabbing}
.header-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s}
.header-dot.connected{background:var(--green);box-shadow:0 0 6px var(--green)}
.header-dot.disconnected{background:var(--red);box-shadow:0 0 6px var(--red)}
.header-title{font-size:12px;font-weight:600;letter-spacing:.3px;flex:1;color:var(--text)}
.header-btn{
  width:24px;height:24px;border:none;background:transparent;color:var(--text-dim);
  cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:all .15s;
}
.header-btn:hover{background:var(--surface-hover);color:var(--text)}
.header-btn.pinned{color:var(--accent)}

/* ── Body ── */
.overlay-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent}
.overlay-body::-webkit-scrollbar{width:4px}
.overlay-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px}

/* ── Sections ── */
.section{padding:12px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none}
.section-label{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}

/* ── Upload Zone ── */
.upload-zone{text-align:center}
.upload-btn{
  width:100%;padding:10px;border:1px dashed var(--border-active);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text-dim);cursor:pointer;font-family:var(--font);
  font-size:12px;font-weight:500;transition:all .2s;
}
.upload-btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--accent)}
.upload-status{font-size:11px;color:var(--text-dim);margin-top:6px;min-height:16px}
.upload-status.success{color:var(--green)}
.upload-status.error{color:var(--red)}
.upload-status.loading{color:var(--yellow)}
.replace-link{font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline;margin-top:4px;display:inline-block}
.replace-link:hover{color:#8b71db}

/* ── Questions Panel ── */
.questions-list{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent}
.question-card{
  padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface);
  border:1px solid var(--border);cursor:pointer;transition:all .15s;display:flex;gap:8px;align-items:flex-start;
}
.question-card:hover{background:var(--surface-hover)}
.question-card.asked{opacity:.4}
.question-card.asked .q-check{color:var(--green)}
.q-check{width:16px;height:16px;flex-shrink:0;color:var(--text-muted);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.q-content{flex:1;min-width:0}
.q-text{font-size:12px;color:var(--text);line-height:1.4}
.q-tag{
  display:inline-block;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;background:rgba(110,86,207,0.15);color:var(--accent);margin-top:4px;
}

/* ── Alert Feed ── */
.alert-feed{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent}
.alert-card{
  padding:8px 10px;border-radius:var(--radius-sm);border-left:3px solid;
  background:var(--surface);animation:alertIn .3s ease;
}
@keyframes alertIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.alert-card.contradiction{border-left-color:var(--red)}
.alert-card.pressure_point{border-left-color:var(--yellow)}
.alert-card.coverage_gap{border-left-color:var(--blue)}
.alert-text{font-size:12px;color:var(--text);line-height:1.4}
.alert-evidence{font-size:11px;color:var(--text-dim);font-style:italic;margin-top:3px}
.alert-time{font-size:10px;color:var(--text-muted);margin-top:3px}
.alert-empty{font-size:11px;color:var(--text-muted);text-align:center;padding:12px 0}

/* ── Footer ── */
.overlay-footer{
  display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
  border-top:1px solid var(--border);flex-shrink:0;background:rgba(255,255,255,0.02);
}
.session-timer{font-size:11px;font-weight:600;color:var(--text-dim);font-variant-numeric:tabular-nums}
.end-btn{
  padding:4px 10px;border:1px solid rgba(229,72,77,0.3);border-radius:var(--radius-sm);
  background:rgba(229,72,77,0.1);color:var(--red);font-size:11px;font-weight:500;
  cursor:pointer;font-family:var(--font);transition:all .15s;
}
.end-btn:hover{background:rgba(229,72,77,0.2);border-color:rgba(229,72,77,0.5)}
.banner{padding:8px 12px;font-size:11px;text-align:center;background:rgba(110,86,207,0.1);color:var(--accent);border-bottom:1px solid var(--border);display:none}
.banner.visible{display:block}
/* Header flash — subtle pulse when questions arrive late (overlay may be minimized) */
@keyframes headerFlash{0%,100%{background:rgba(255,255,255,0.02)}50%{background:rgba(110,86,207,0.12)}}
.overlay-header.flash{animation:headerFlash .6s ease 3}
</style>
</head>
<body>

<!-- ── GhostCue Floating Overlay ── -->
<div id="overlay">

  <!-- Banner for status messages -->
  <div class="banner" id="banner"></div>

  <!-- Header with drag handle, status, and controls -->
  <div class="overlay-header" id="dragHandle">
    <div class="header-dot disconnected" id="statusDot" title="Agent connection status"></div>
    <span class="header-title">GhostCue</span>
    <button class="header-btn" id="pinBtn" title="Pin on top">&#x1F4CC;</button>
    <button class="header-btn" id="minBtn" title="Minimize">&#x2015;</button>
    <button class="header-btn" id="closeBtn" title="Close">&times;</button>
  </div>

  <!-- Scrollable body -->
  <div class="overlay-body">

    <!-- Resume Upload Zone -->
    <div class="section upload-zone" id="uploadSection">
      <div class="section-label">Resume</div>
      <button class="upload-btn" id="uploadBtn">Upload Resume</button>
      <input type="file" id="fileInput" accept=".pdf" style="display:none">
      <div class="upload-status" id="uploadStatus"></div>
    </div>

    <!-- Generated Questions Panel -->
    <div class="section" id="questionsSection" style="display:none">
      <div class="section-label">Questions</div>
      <div class="questions-list" id="questionsList"></div>
      <!-- Refresh link — manual recovery if questions_ready was missed -->
      <div style="text-align:center;margin-top:6px" id="refreshRow" style="display:none">
        <span class="replace-link" id="refreshBtn">Refresh questions</span>
      </div>
    </div>

    <!-- Live Alert Feed -->
    <div class="section">
      <div class="section-label">Live Alerts</div>
      <div class="alert-feed" id="alertFeed">
        <div class="alert-empty" id="alertEmpty">No alerts yet</div>
      </div>
    </div>

  </div>

  <!-- Footer with timer and end session -->
  <div class="overlay-footer">
    <span class="session-timer" id="sessionTimer">00:00</span>
    <button class="end-btn" id="endBtn">End Session</button>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════════
// GhostCue Overlay — Inline JavaScript (single-file, no build)
// Connects to the agent daemon via WebSocket, handles resume
// uploads via REST, and renders real-time interview alerts.
// ════════════════════════════════════════════════════════════

const API = 'http://localhost:3000';
const WS_URL = 'ws://localhost:3000/agent';

// ── DOM refs ──
const overlay    = document.getElementById('overlay');
const statusDot  = document.getElementById('statusDot');
const pinBtn     = document.getElementById('pinBtn');
const minBtn     = document.getElementById('minBtn');
const closeBtn   = document.getElementById('closeBtn');
const dragHandle = document.getElementById('dragHandle');
const uploadBtn  = document.getElementById('uploadBtn');
const fileInput  = document.getElementById('fileInput');
const uploadStatus = document.getElementById('uploadStatus');
const uploadSection = document.getElementById('uploadSection');
const questionsSection = document.getElementById('questionsSection');
const questionsList = document.getElementById('questionsList');
const alertFeed  = document.getElementById('alertFeed');
const alertEmpty = document.getElementById('alertEmpty');
const sessionTimer = document.getElementById('sessionTimer');
const endBtn     = document.getElementById('endBtn');
const banner     = document.getElementById('banner');
const refreshBtn = document.getElementById('refreshBtn');
const refreshRow = document.getElementById('refreshRow');
const dragHandle = document.getElementById('dragHandle');

// ── State ──
let ws = null;
let reconnectDelay = 1000;  // Exponential backoff starting point
let isPinned = false;
let isMinimized = false;
let timerInterval = null;
let timerStart = null;
let candidateId = null;          // Most recent candidate ID (for Refresh button)
let questionsReceivedAt = null;  // Timestamp when questions first arrived

// ════════════════════════════════
// 1. WebSocket Connection
// ════════════════════════════════

function connectWS() {
  try { ws = new WebSocket(WS_URL); } catch(e) { scheduleReconnect(); return; }

  ws.onopen = () => {
    console.log('[GhostCue] WS connected');
    statusDot.className = 'header-dot connected';
    statusDot.title = 'Connected to agent';
    reconnectDelay = 1000; // Reset backoff on successful connect
  };

  ws.onclose = () => {
    console.log('[GhostCue] WS disconnected');
    statusDot.className = 'header-dot disconnected';
    statusDot.title = 'Disconnected — reconnecting...';
    scheduleReconnect();
  };

  ws.onerror = () => {
    statusDot.className = 'header-dot disconnected';
  };

  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      handleWSMessage(msg);
    } catch(e) { console.error('[GhostCue] Bad WS message', e); }
  };
}

function scheduleReconnect() {
  // Exponential backoff: 1s → 2s → 4s → 8s → max 15s
  setTimeout(() => {
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
    connectWS();
  }, reconnectDelay);
}

// ── Handle incoming WebSocket messages from the agent ──
function handleWSMessage(msg) {
  const { event, data } = msg;

  switch(event) {
    case 'connected':
      // Agent welcome — store active candidate if any
      if (data?.activeCandidate) candidateId = data.activeCandidate;
      break;

    case 'questions_ready':
      // Resume parsed, questions generated — populate the panel
      if (data?.candidate_id) candidateId = data.candidate_id;
      renderQuestions(data.questions || []);
      setUploadStatus('Questions ready', 'success');

      // Flash the header if the overlay is minimized so the user notices
      questionsReceivedAt = Date.now();
      dragHandle.classList.remove('flash');
      // Force reflow to restart animation if it already ran
      void dragHandle.offsetWidth;
      dragHandle.classList.add('flash');
      setTimeout(() => dragHandle.classList.remove('flash'), 2000);

      // Show the Refresh link so the user can manually re-fetch if needed
      refreshRow.style.display = 'block';

      // Shrink upload zone to a replace link
      uploadBtn.style.display = 'none';
      uploadSection.querySelectorAll('.replace-link').forEach(el => el.remove());
      const link = document.createElement('span');
      link.className = 'replace-link';
      link.textContent = 'Replace resume';
      link.onclick = () => fileInput.click();
      uploadSection.appendChild(link);
      break;

    case 'resume_uploaded':
      setUploadStatus('Parsing resume...', 'loading');
      break;

    case 'resume_received':
      setUploadStatus('Parsing resume...', 'loading');
      break;

    case 'alert':
      // Real-time alert from the agent (contradiction, pressure point, coverage gap)
      appendAlert(data);
      break;

    case 'session_start':
      // Interview session started — begin timer
      startTimer();
      clearAlerts();
      if (data?.candidateId) candidateId = data.candidateId;
      showBanner('Session started — listening...');
      setTimeout(() => hideBanner(), 3000);
      break;

    case 'session_end':
      // Session ended — stop timer, show report banner
      stopTimer();
      showBanner('Report generating...');
      break;

    case 'candidate_set':
      if (data?.candidateId) candidateId = data.candidateId;
      break;

    case 'pong':
      break; // Heartbeat response, no action needed

    default:
      console.log('[GhostCue] Unhandled event:', event);
  }
}

// ════════════════════════════════
// 2. Resume Upload
// ════════════════════════════════

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  // Client-side validation
  if (!file.name.toLowerCase().endsWith('.pdf')) {
    setUploadStatus('Only PDF files are accepted', 'error');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    setUploadStatus('File too large (max 10 MB)', 'error');
    return;
  }

  setUploadStatus('Uploading...', 'loading');

  const formData = new FormData();
  formData.append('resume', file);

  try {
    const res = await fetch(`${API}/api/upload-resume`, { method: 'POST', body: formData });
    const json = await res.json();

    if (res.ok) {
      setUploadStatus('Parsing resume...', 'loading');
      // After upload, send set_candidate once we get the candidate ID via WS
    } else {
      setUploadStatus(json.message || json.error || 'Upload failed', 'error');
    }
  } catch(e) {
    setUploadStatus('Cannot reach agent — is it running?', 'error');
  }

  // Reset file input so the same file can be re-uploaded
  fileInput.value = '';
});

function setUploadStatus(text, cls) {
  uploadStatus.textContent = text;
  uploadStatus.className = 'upload-status' + (cls ? ' ' + cls : '');
}

// ════════════════════════════════
// 3. Questions Panel
// ════════════════════════════════

function renderQuestions(questions) {
  questionsSection.style.display = 'block';
  questionsList.innerHTML = '';

  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.innerHTML = `
      <div class="q-check">&#x25CB;</div>
      <div class="q-content">
        <div class="q-text">${escHtml(q.text || q)}</div>
        ${q.competency ? `<span class="q-tag">${escHtml(q.competency)}</span>` : ''}
      </div>`;
    // Click to toggle "asked" state
    card.addEventListener('click', () => {
      card.classList.toggle('asked');
      card.querySelector('.q-check').innerHTML = card.classList.contains('asked') ? '&#x2713;' : '&#x25CB;';
    });
    questionsList.appendChild(card);
  });
}

// ════════════════════════════════
// 4. Live Alert Feed
// ════════════════════════════════

function appendAlert(data) {
  // Hide the "no alerts" placeholder
  alertEmpty.style.display = 'none';

  const card = document.createElement('div');
  const alertType = data.type || 'alert';
  card.className = `alert-card ${alertType}`;

  const text = data.text || data.message || '';
  const evidence = data.evidence || '';
  const time = data.timestamp ? new Date(data.timestamp).toLocaleTimeString() : '';

  card.innerHTML = `
    <div class="alert-text">${escHtml(text)}</div>
    ${evidence ? `<div class="alert-evidence">"${escHtml(evidence)}"</div>` : ''}
    <div class="alert-time">${escHtml(time)}</div>`;

  // Insert newest at top — but only auto-scroll if user is already at top
  const feed = alertFeed;
  const wasAtTop = feed.scrollTop < 10;
  feed.insertBefore(card, feed.firstChild);
  if (wasAtTop) feed.scrollTop = 0;
}

function clearAlerts() {
  alertFeed.innerHTML = '<div class="alert-empty" id="alertEmpty">No alerts yet</div>';
}

// ════════════════════════════════
// 5. Session Timer
// ════════════════════════════════

function startTimer() {
  if (timerInterval) return;
  timerStart = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - timerStart) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    sessionTimer.textContent = `${m}:${s}`;
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

// ════════════════════════════════
// 6. End Session
// ════════════════════════════════

endBtn.addEventListener('click', async () => {
  try {
    await fetch(`${API}/api/sessions/end`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    stopTimer();
    showBanner('Session ended');
    setTimeout(() => hideBanner(), 4000);
  } catch(e) {
    console.error('[GhostCue] End session failed', e);
  }
});

// Refresh button — calls the manual broadcast endpoint to re-fetch questions
if (refreshBtn) {
  refreshBtn.addEventListener('click', async () => {
    if (!candidateId) {
      setUploadStatus('No candidate loaded yet', 'error');
      return;
    }
    try {
      refreshBtn.textContent = 'Refreshing...';
      const res = await fetch(`${API}/api/candidates/${candidateId}/broadcast`, { method: 'POST' });
      const json = await res.json();
      if (!res.ok) {
        setUploadStatus(json.error || 'Refresh failed', 'error');
      }
      // questions_ready will arrive via WS and re-render automatically
      setTimeout(() => { refreshBtn.textContent = 'Refresh questions'; }, 2000);
    } catch(e) {
      refreshBtn.textContent = 'Refresh questions';
      setUploadStatus('Cannot reach agent', 'error');
    }
  });
}

// ════════════════════════════════
// 7. Drag, Minimize, Pin, Close
// ════════════════════════════════

// Drag
let isDragging = false, dragOffX = 0, dragOffY = 0;
dragHandle.addEventListener('mousedown', (e) => {
  if (e.target.closest('.header-btn')) return; // Don't drag when clicking buttons
  isDragging = true;
  dragOffX = e.clientX - overlay.getBoundingClientRect().left;
  dragOffY = e.clientY - overlay.getBoundingClientRect().top;
  overlay.style.transition = 'none';
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  overlay.style.left = (e.clientX - dragOffX) + 'px';
  overlay.style.top = (e.clientY - dragOffY) + 'px';
  overlay.style.right = 'auto';
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  overlay.style.transition = '';
});

// Minimize
minBtn.addEventListener('click', () => {
  isMinimized = !isMinimized;
  overlay.classList.toggle('minimized', isMinimized);
  minBtn.innerHTML = isMinimized ? '&#x25A1;' : '&#x2015;';
  minBtn.title = isMinimized ? 'Expand' : 'Minimize';
});

// Pin (visual only in browser — Electron wrapper enables real always-on-top)
pinBtn.addEventListener('click', () => {
  isPinned = !isPinned;
  pinBtn.classList.toggle('pinned', isPinned);
  pinBtn.title = isPinned ? 'Unpin' : 'Pin on top';
});

// Close
closeBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  if (ws) ws.close();
});

// ════════════════════════════════
// 8. Utility
// ════════════════════════════════

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showBanner(text) { banner.textContent = text; banner.classList.add('visible'); }
function hideBanner() { banner.classList.remove('visible'); }

// ── Boot ──
connectWS();
</script>
</body>
</html>
